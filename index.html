
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="TaskFlow helps you organize, manage, and track your tasks."
  >
  <title>TaskFlow — Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="./">TaskFlow</a>

      <button id="logout-button" type="button" hidden>
        Log out
      </button>
    </div>
  </header>

  <main class="container">
    <section id="login-section" aria-labelledby="login-title">
      <h1 id="login-title">Welcome to TaskFlow</h1>
      <p>Sign in to manage your tasks.</p>

      <form id="login-form">
        <label for="username">Your name</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required
          maxlength="40"
        >

        <button type="submit">Continue</button>
      </form>

      <p id="login-message" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard-section" hidden aria-labelledby="dashboard-title">
      <div class="dashboard-heading">
        <div>
          <h1 id="dashboard-title">My Tasks</h1>
          <p id="welcome-message"></p>
        </div>

        <button id="add-task-button" type="button">
          + Add Task
        </button>
      </div>

      <section class="task-stats" aria-label="Task statistics">
        <article>
          <h2>Total Tasks</h2>
          <p id="total-tasks">0</p>
        </article>

        <article>
          <h2>Pending</h2>
          <p id="pending-tasks">0</p>
        </article>

        <article>
          <h2>Completed</h2>
          <p id="completed-tasks">0</p>
        </article>
      </section>

      <section class="task-controls" aria-label="Task controls">
        <label for="task-search">Search tasks</label>
        <input
          id="task-search"
          type="search"
          placeholder="Search by task title..."
        >

        <label for="task-filter">Filter tasks</label>
        <select id="task-filter">
          <option value="all">All tasks</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </section>

      <section aria-labelledby="task-list-title">
        <h2 id="task-list-title">Your Task List</h2>
        <p id="task-status" role="status" aria-live="polite">
          Your tasks will appear here.
        </p>

        <div id="task-list"></div>
      </section>
    </section>
  </main>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form">
      <h2 id="task-dialog-title">Add a Task</h2>

      <label for="task-title">Task title</label>
      <input
        id="task-title"
        name="title"
        type="text"
        required
        maxlength="100"
      >

      <label for="task-description">Description (optional)</label>
      <textarea
        id="task-description"
        name="description"
        rows="3"
        maxlength="500"
      ></textarea>

      <div class="dialog-actions">
        <button id="cancel-task-button" type="button">
          Cancel
        </button>
        <button type="submit">Save Task</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <div class="container">
      <p>TaskFlow — A simple way to stay organized.</p>
    </div>
  </footer>
</body>
</html>
